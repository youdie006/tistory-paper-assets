<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#ffffff"/>
<style>.t{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:48px;font-weight:700}.s{font-size:23px;fill:#64748b}.b{font-size:30px;font-weight:700}.p{font-size:25px;fill:#334155}.box{stroke-width:4;rx:24}.a{stroke:#334155;stroke-width:8;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#334155"/></marker></defs>
<text x="70" y="82" class="t h">StarHarness: stratified search, hidden selection, and holdout evaluation</text>
<text x="72" y="124" class="t s">Reviewer reconstruction based on Sections 3.2–3.4 of arXiv:2608.24804</text>
<g><rect x="70" y="180" width="510" height="260" fill="#eff6ff" stroke="#2563eb" class="box"/><text x="100" y="230" class="t b">1. Baseline characterization</text><text x="100" y="285" class="t p">Run reproducible tasks</text><text x="100" y="325" class="t p">Failure mode: wrong tool, context loss,</text><text x="100" y="365" class="t p">missing evidence, premature conclusion</text><text x="100" y="405" class="t p">Score and verifier pass rate</text></g>
<g><rect x="745" y="180" width="510" height="260" fill="#f5f3ff" stroke="#7c3aed" class="box"/><text x="775" y="230" class="t b">2. Stratified evolution pool</text><text x="775" y="285" class="t p">Typically K is about N/2</text><text x="775" y="325" class="t p">Match failure-mode, score,</text><text x="775" y="365" class="t p">and verifier-pass distributions</text><text x="775" y="405" class="t p">before search begins</text></g>
<g><rect x="1420" y="180" width="510" height="260" fill="#fff7ed" stroke="#ea580c" class="box"/><text x="1450" y="230" class="t b">3. Frozen holdout</text><text x="1450" y="285" class="t p">Remaining tasks never affect</text><text x="1450" y="325" class="t p">proposal or acceptance</text><text x="1450" y="365" class="t p">Evaluate once after evolution</text><text x="1450" y="405" class="t p">Measures task generalization</text></g>
<path d="M580 310 H730" class="a"/><path d="M1255 310 H1405" class="a"/>
<g><rect x="70" y="560" width="510" height="305" fill="#ecfdf5" stroke="#059669" class="box"/><text x="100" y="610" class="t b">Search: proposer-visible</text><text x="100" y="670" class="t p">Current frontier and ledger</text><text x="100" y="710" class="t p">Search traces and outcomes</text><text x="100" y="750" class="t p">One bounded scoped patch</text><text x="100" y="790" class="t p">No selection or holdout traces</text></g>
<g><rect x="745" y="560" width="510" height="305" fill="#fefce8" stroke="#ca8a04" class="box"/><text x="775" y="610" class="t b">Candidate gates</text><text x="775" y="670" class="t p">Scope and leakage checks</text><text x="775" y="710" class="t p">Import and smoke test</text><text x="775" y="750" class="t p">Proposer-selected test flip</text><text x="775" y="790" class="t p">Reject and revert on failure</text></g>
<g><rect x="1420" y="560" width="510" height="305" fill="#fdf2f8" stroke="#db2777" class="box"/><text x="1450" y="610" class="t b">Selection: proposer-hidden</text><text x="1450" y="670" class="t p">Evaluate valid candidates</text><text x="1450" y="710" class="t p">Promote only if mean improves</text><text x="1450" y="750" class="t p">Verifier rate breaks ties</text><text x="1450" y="790" class="t p">Commit frontier and update ledger</text></g>
<path d="M580 712 H730" class="a"/><path d="M1255 712 H1405" class="a"/>
<g><rect x="745" y="990" width="510" height="145" fill="#f8fafc" stroke="#475569" class="box"/><text x="785" y="1040" class="t b">Final evolved harness</text><text x="785" y="1085" class="t p">One holdout and full evaluation</text></g>
<path d="M1675 865 V1020 H1270" class="a"/>
</svg>
